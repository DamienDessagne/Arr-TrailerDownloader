[Config]
# Whether to log everything the script does
log_activity = True

# The maximum number of log files to keep
max_log_files = 5

# Whether to automatically keep dependencies (yt-dlp, yt-dlp-ejs, Requests) up to date.
# Since YouTube regularly breaks yt-dlp, this keeps the script working without manual maintenance.
auto_update_libs = True

# Minimum number of minutes between two automatic dependency updates, to avoid slowing down every single launch
# (e.g. when Radarr/Sonarr triggers the script many times in a row). Only relevant if auto_update_libs is True.
auto_update_libs_interval_minutes = 60

# Your TMDB API key, OPTIONAL. If not provided, language-dependant features won't be activated
tmdb_api_key = YOUR_API_KEY

# Youtube API key (see https://developers.google.com/youtube/v3/getting-started)
youtube_api_key = YOUR_API_KEY

# OPTIONAL. Cookies are only needed to download videos with age restrictions: when they are unavailable, the
# download is simply attempted anonymously. See https://github.com/yt-dlp/yt-dlp/wiki/FAQ#how-do-i-pass-cookies-to-yt-dlp for details.

# Browser name to get cookies from. In Docker, no browser is actually installed in the container, but this can
# still work for Firefox: mount your Firefox profile folder read-only into the container (see the README) and
# append its in-container path after a colon, e.g. `firefox:/cookies/my-profile`. Chrome-based browsers encrypt
# their cookies using Windows' own credential store, which isn't reachable from inside a container, so this
# trick only works for Firefox.
# 	supported values at the time of writing this: brave, chrome, chromium, edge, firefox, opera, safari, vivaldi, whale
yt_dlp_cookies_browser = firefox

# Path to a cookies.txt file, exported from your browser (e.g. with the "Get cookies.txt LOCALLY" extension).
# This is the only way to use cookies in Docker: export the file, mount it in the container, and put the path
# it has *inside the container* here (e.g. /app/cookies.txt).
yt_dlp_cookies_file =

[Server]
# OPTIONAL - only used when the script runs in server mode (`--serve`), i.e. from Docker or run_server.bat/.sh.
# In server mode the script stays running and listens for Radarr/Sonarr *Webhook* connections, instead of being
# launched once per event as a Custom Script.

# Address to listen on. Use 0.0.0.0 to accept connections from other machines/containers (required in Docker),
# or 127.0.0.1 to only accept connections coming from this very machine.
host = 0.0.0.0

# Port to listen on. Must match the port used in the Radarr/Sonarr webhook URL.
port = 8189

# OPTIONAL basic authentication, matching the Username/Password fields of the Radarr/Sonarr webhook connection.
# Leave both empty to disable authentication.
username =
password =

[PathMappings]
# OPTIONAL - only useful in server mode, when Radarr/Sonarr see your libraries under different paths than this
# script does (typically when Radarr/Sonarr run in Docker and this script doesn't, or the other way around).
# One mapping per line, formatted as `path_as_seen_by_radarr_sonarr -> path_as_seen_by_this_script`.
# Example:
# mappings =
#     /movies -> D:\Movies
#     /tv -> D:\TV Shows
mappings =

# Language-dependant parameters to search for trailers on Youtube.
#   use_original_movie_name : True | False, whether to use the english name or the original name to search for the trailer
#   search_keywords : the suffix appended to the YouTube search query for a specific language. The resulting query will be something like 'Movie Title YEAR keywords'.
# You can add more languages simply by duplicating the section and specifying the language code in the section's name
# Example :
# [YoutubeParams.fr]
# use_original_movie_name = True
# search_keywords = bande annonce
[YoutubeParams.default]
use_original_movie_name = False
search_keywords = trailer

[ReencodeRules]
# OPTIONAL
# Use this section to specify the reencoding rules to apply to downloaded trailers. For instance, if you want videos in AV1 to be reencoded to H264, add a line with `video.av1 = h264`.
# For a list of encoders, use `ffmpeg -encoders`
# Format: {audio|video}.source_codec = target_codec
#video.av1 = h264
#video.vp9 = h264
#audio.eac3 = ac3

[EncodingParams]
# OPTIONAL
# Use this section to specify additional encoding parameters for your encoding rules. Video encoding parameters
# Format: {audio|video}.target_codec.param = value
#video.h264.crf = 28
#video.h264.preset = faster